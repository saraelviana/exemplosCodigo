<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flipcard</title>
    <link rel="stylesheet" href="flipcard.css">
</head>
<body>
    <div id="container">
        <!-- definir o fundo e os elementos que vai ser preciso agrupar-->
         <div class="flip-card">
            
             <div class="flip-card-inner">
                <!-- esta div e que vai posicionar uma imagem atras da outra-->
                 <!-- aqui vai ter a parte da frente e a de tras-->
                  <div class="flip-card-front"><!-- div da frente-->
                    <img src="img/logo-roxo.jpg" alt="" class="flip-card-img">

                  </div>
                  <div class="flip-card-back"><!-- div de tras-->
                    <img src="img/store_type_1630474900280.png" alt="" class="flip-card-img">


                  </div>

             </div>

         </div>

    </div>
    
</body>
</html>
