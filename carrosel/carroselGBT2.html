<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel com Transição Suave</title>
  <style>
    /* ======= ESTILOS GERAIS ======= */
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #1b1b2f, #16213e, #0f3460); /* fundo colorido */
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 90%;
      max-width: 900px;
      position: relative;
    }

    /* ======= BOTÕES ======= */
    .scroll-button {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      font-size: 32px;
      padding: 12px 16px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      z-index: 10;
    }

    .scroll-button:hover {
      background: rgba(0, 0, 0, 0.85);
      transform: scale(1.1);
    }

    /* ======= CONTAINER DO CARROSSEL ======= */
    .container {
      display: flex;
      width: 800px;
      height: 400px;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.5s ease-in-out;
    }

    /* ======= ITENS (CADA “IMAGEM”) ======= */
    .item {
      min-width: 800px;
      height: 400px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: white;
      transition: transform 0.5s ease-in-out;
    }

    /* 7 cores diferentes */
    .item:nth-child(1) { background: #ff595e; }
    .item:nth-child(2) { background: #ffca3a; color: #111; }
    .item:nth-child(3) { background: #8ac926; }
    .item:nth-child(4) { background: #1982c4; }
    .item:nth-child(5) { background: #6a4c93; }
    .item:nth-child(6) { background: #ff924c; color: #111; }
    .item:nth-child(7) { background: #00b4d8; }

    /* ======= ANIMAÇÃO DE TRANSIÇÃO ======= */
    .slide {
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <button class="scroll-button" id="left">⟨</button>

    <div class="container" id="carousel">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
      <div class="item">7</div>
    </div>

    <button class="scroll-button" id="right">⟩</button>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const items = document.querySelectorAll('.item');
    let index = 0;

    function showSlide(i) {
      if (i < 0) index = items.length - 1;
      else if (i >= items.length) index = 0;
      else index = i;

      // Aplica o efeito de transição suave
      carousel.style.transition = "transform 0.8s ease-in-out";
      carousel.style.transform = `translateX(${-index * 800}px)`;
    }

    document.getElementById('right').addEventListener('click', () => showSlide(index + 1));
    document.getElementById('left').addEventListener('click', () => showSlide(index - 1));

    // Troca automática a cada 5 segundos
    setInterval(() => showSlide(index + 1), 5000);
  </script>
</body>
</html>
