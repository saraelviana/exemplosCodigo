<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS Transform</title>
    <link rel="stylesheet" href="teste1.css">
</head>
<body>

    <h1>Exemplos da Propriedade CSS `transform`</h1>
    <div class="container">
        <div class="box div-1">
            <span>1. translateX(50px)</span>
        </div>

        <div class="box div-2">
            <span>2. translateY(30px)</span>
        </div>

        <div class="box div-3">
            <span>3. translate(20px, 40px)</span>
        </div>

        <div class="box div-4">
            <span>4. rotate(45deg)</span>
        </div>

        <div class="box div-5">
            <span>5. scaleX(1.5)</span>
        </div>

        <div class="box div-6">
            <span>6. scaleY(0.7)</span>
        </div>
        
        <div class="box div-7">
            <span>7. skewX(15deg)</span>
        </div>
    </div>

</body>
</html>
