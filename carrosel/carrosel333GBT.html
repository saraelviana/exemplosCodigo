<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrossel sem moldura preta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-image: url(ChatGPT\ Image\ 22\ de\ out.\ de\ 2025\,\ 17_53_54.png);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .carousel {
      --n: 9;
      width: 95%;
      max-width: 1000px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      position: relative;
      touch-action: pan-y;
    }

    .carousel-track {
      display: flex;
      width: calc(var(--n) * 100%);
      transition: transform 0.6s ease;
      will-change: transform;
    }

    .carousel-slide {
      flex: 0 0 calc(100% / var(--n));
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    /* imagem ocupa toda a largura do container e ajusta altura proporcional */
    .carousel-slide img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover; /* cobre totalmente a área sem sobras pretas */
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.45);
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-50%) scale(1.03); }
    .btn:active { transform: translateY(-50%) scale(.98); }
    .btn.prev { left: 12px; }
    .btn.next { right: 12px; }

    @media (max-width: 720px) {
      .btn { width: 56px; height: 56px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="carousel" id="carousel">
    <button class="btn prev" aria-label="Anterior">&#10094;</button>

    <div class="carousel-track" id="track">
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 1"></div>
      <div class="carousel-slide"><img src="bolsa/6hq720.jpg" alt="Imagem 2"></div>
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 3"></div>
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 4"></div>
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 5"></div>
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 6"></div>
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 7"></div>
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 8"></div>
      <div class="carousel-slide"><img src="bolsa/4hq720.jpg" alt="Imagem 9"></div>
    </div>

    <button class="btn next" aria-label="Próxima">&#10095;</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const carousel = document.getElementById('carousel');
      const track = document.getElementById('track');
      const slides = Array.from(track.querySelectorAll('.carousel-slide'));
      const prevBtn = carousel.querySelector('.prev');
      const nextBtn = carousel.querySelector('.next');
      const total = slides.length;
      let index = 0;

      carousel.style.setProperty('--n', total);

      function updateTransform() {
        const shiftPct = -index * (100 / total);
        track.style.transform = `translateX(${shiftPct}%)`;
      }

      nextBtn.addEventListener('click', () => {
        index = (index + 1) % total;
        updateTransform();
      });

      prevBtn.addEventListener('click', () => {
        index = (index - 1 + total) % total;
        updateTransform();
      });

      updateTransform();
    });
  </script>
</body>
</html>
